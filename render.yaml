services:
  - type: web
    name: roadsense
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: https://roadsense.onrender.com
      - key: APP_ORIGIN
        value: https://roadsense-q3k7.onrender.com
      - key: ROADSENSE_DATA_DIR
        value: /var/data
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_TLS
        value: "true"
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: DEFAULT_AUTHORITY_EMAIL
        sync: false
      - key: DEFAULT_AUTHORITY_NAME
        value: RoadSense incident notifications
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
    disk:
      name: roadsense-data
      mountPath: /var/data
      sizeGB: 1
